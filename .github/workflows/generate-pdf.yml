name: Generate and Send CV PDF

on:
  push:
    paths:
      - "data/**" # Kích hoạt mỗi khi bạn cập nhật bất kỳ file data nào

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Package and Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install puppeteer express form-data

      - name: Run Puppeteer PDF Generator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/generate-pdf.js
